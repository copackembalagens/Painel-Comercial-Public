<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel Comercial CoPack</title>
<style>
  :root {
    --verde-escuro: #7A7021;
    --verde-lima: #ABAD00;
    --preto: #231F20;
  }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: var(--preto);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }
  .box { padding: 2rem; }
  h1 { color: var(--verde-escuro); margin-bottom: 0.25rem; }
  p { color: #555; }
  .barra { height: 4px; width: 80px; background: var(--verde-lima); margin: 1rem auto; border-radius: 2px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Painel Comercial CoPack</h1>
    <div class="barra"></div>
    <p>Em construção — o painel será publicado aqui em breve.</p>
  </div>
</body>
</html>
